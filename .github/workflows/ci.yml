name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module metadata
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test -race ./...
      - name: Build all packages
        run: go build ./...
      - name: Build release archives
        env:
          VERSION: v0.0.0-ci
        run: ./scripts/release/build-archives.sh
      - name: Verify release checksums
        run: sha256sum --check dist/checksums.txt

  vulnerability-scan:
    name: Scan for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: '1.26.6'
          go-package: ./...
          check-latest: false
